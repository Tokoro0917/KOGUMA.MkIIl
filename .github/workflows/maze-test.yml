name: maze-test

# Core/Src/Maze.c はHALに依存しないので、ホストのgccにそのままリンクして
# 迷路アルゴリズムの不変条件を検証できる。ファームウェア本体のARMビルドは
# ここでは行わない。
# pushとpull_requestの両方を無条件に拾うと、PRブランチへのpushで
# 同じジョブが2回走る。masterへのpushとPRだけに絞る
on:
  push:
    branches: [master]
  pull_request:

jobs:
  deadend-fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 行き止まり潰しの検証 (16x16)
        run: |
          gcc -std=c11 -Wall -I Core/Inc -o test_deadend \
            test/test_deadend.c Core/Src/Maze.c Core/Src/ShortParam.c -lm
          ./test_deadend

      - name: 行き止まり潰しの検証 (32x32)
        run: |
          gcc -std=c11 -Wall -DMAZE_SIZE=32 -I Core/Inc -o test_deadend32 \
            test/test_deadend.c Core/Src/Maze.c Core/Src/ShortParam.c -lm
          ./test_deadend32

      - name: 最短走行の命令列の検証 (16x16)
        run: |
          gcc -std=c11 -Wall -I Core/Inc -o test_shortpath \
            test/test_shortpath.c Core/Src/Maze.c Core/Src/ShortParam.c -lm
          ./test_shortpath

      - name: 最短走行の命令列の検証 (32x32)
        run: |
          gcc -std=c11 -Wall -DMAZE_SIZE=32 -I Core/Inc -o test_shortpath32 \
            test/test_shortpath.c Core/Src/Maze.c Core/Src/ShortParam.c -lm
          ./test_shortpath32

      - name: 大会の迷路で最短の経路を確かめる (mazes/)
        run: |
          gcc -std=c11 -Wall -I Core/Inc -o test_shortpath_dump \
            test/test_shortpath.c Core/Src/Maze.c Core/Src/ShortParam.c -lm
          for f in mazes/*.txt; do echo "== $f"; ./test_shortpath_dump --dump "$f"; done

      - name: ダイクストラが本当に一番速い経路か、小さい迷路で全部の経路と比べる (6x6・8x8)
        run: |
          gcc -std=c11 -O2 -Wall -DMAZE_SIZE=6 -I Core/Inc -o test_shortpath6 \
            test/test_shortpath.c Core/Src/Maze.c Core/Src/ShortParam.c -lm
          ./test_shortpath6 --brute 300 40
          gcc -std=c11 -O2 -Wall -DMAZE_SIZE=8 -I Core/Inc -o test_shortpath8 \
            test/test_shortpath.c Core/Src/Maze.c Core/Src/ShortParam.c -lm
          ./test_shortpath8 --brute 100 30

      - name: ダイクストラ誘導の未知壁探索の検証 (シミュレータ、16x16)
        run: |
          gcc -std=c11 -Wall -DSIM_DEBUG -I Core/Inc -I . -I sim -o test_unknown_search \
            test/test_unknown_search.c Core/Src/Maze.c Core/Src/ShortParam.c -lm
          ./test_unknown_search

      - name: フェイルセーフで最後の5区画の壁を戻す検証 (シミュレータ、16x16)
        run: |
          gcc -std=c11 -Wall -DSIM_DEBUG -I Core/Inc -I . -I sim -o test_maze_undo \
            test/test_maze_undo.c Core/Src/Maze.c Core/Src/ShortParam.c -lm
          ./test_maze_undo

      - name: 既知区間加速の命令列の検証 (16x16)
        run: |
          gcc -std=c11 -Wall -I Core/Inc -o test_knownpass \
            test/test_knownpass.c Core/Src/Maze.c Core/Src/ShortParam.c -lm
          ./test_knownpass

  walldist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 壁センサ距離変換の表の検証
        run: |
          gcc -std=c11 -Wall -I Core/Inc -o test_walldist \
            test/test_walldist.c Core/Src/WallDistance.c
          ./test_walldist

  speedplan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ターンごとの通過速度の速度計画の検証
        run: |
          gcc -std=c11 -Wall -I Core/Inc -o test_speedplan \
            test/test_speedplan.c Core/Src/SpeedPlan.c -lm
          ./test_speedplan

  disthist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 距離ごとのセンサ値の履歴(柱の壁切れ)の検証
        run: |
          gcc -std=c11 -Wall -I Core/Inc -o test_disthist \
            test/test_disthist.c Core/Src/DistHist.c -lm
          ./test_disthist

      - name: 柱の端の検出の検証
        run: |
          gcc -std=c11 -Wall -I Core/Inc -o test_pillaredge \
            test/test_pillaredge.c Core/Src/PillarEdge.c Core/Src/DistHist.c -lm
          ./test_pillaredge
